name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Bump versions across all workspaces
        run: |
          VERSION="${{ github.event.inputs.version }}"
          npm pkg set version="$VERSION" --workspace packages/cli
          npm pkg set version="$VERSION" --workspace packages/darwin-arm64
          npm pkg set version="$VERSION" --workspace packages/linux-x64
          npm pkg set version="$VERSION" --workspace packages/win32-x64
          npm pkg set "optionalDependencies.@nestforge/cli-darwin-arm64=$VERSION" --workspace packages/cli
          npm pkg set "optionalDependencies.@nestforge/cli-linux-x64=$VERSION" --workspace packages/cli
          npm pkg set "optionalDependencies.@nestforge/cli-win32-x64=$VERSION" --workspace packages/cli
      - name: Download compiled binaries from upstream
        run: |
          VERSION="${{ github.event.inputs.version }}"
          mkdir -p /tmp/nestforge-binaries
          gh release download "v$VERSION" \
            --repo vernonthedev/nestforge \
            --dir /tmp/nestforge-binaries
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Place binaries into platform package directories
        run: |
          cp /tmp/nestforge-binaries/nestforge-darwin-arm64 packages/darwin-arm64/nestforge-darwin-arm64
          cp /tmp/nestforge-binaries/nestforge-linux-x64 packages/linux-x64/nestforge-linux-x64
          cp /tmp/nestforge-binaries/nestforge-win32-x64.exe packages/win32-x64/nestforge-win32-x64.exe
      - name: Set executable permissions on Unix binaries
        run: |
          chmod +x packages/darwin-arm64/nestforge-darwin-arm64
          chmod +x packages/linux-x64/nestforge-linux-x64
