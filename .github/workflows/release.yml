name: Automated Package Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_release: ${{ steps.extract.outputs.is_release }}
    steps:
      - id: extract
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            MSG=$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH")
            if [[ "$MSG" =~ ^release:\ \{([0-9]+\.[0-9]+\.[0-9]+)\} ]]; then
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            else
              echo "is_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-darwin-arm64:
    needs: get-version
    if: needs.get-version.outputs.is_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vernonthedev/nestforge
          ref: v${{ needs.get-version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --package nestforge-cli --target aarch64-apple-darwin
      - run: cp target/aarch64-apple-darwin/release/nestforge nestforge-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: nestforge-darwin-arm64
          path: nestforge-darwin-arm64

  build-linux-x64:
    needs: get-version
    if: needs.get-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vernonthedev/nestforge
          ref: v${{ needs.get-version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --package nestforge-cli
      - run: cp target/release/nestforge nestforge-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: nestforge-linux-x64
          path: nestforge-linux-x64

  build-win32-x64:
    needs: get-version
    if: needs.get-version.outputs.is_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vernonthedev/nestforge
          ref: v${{ needs.get-version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --package nestforge-cli
      - run: copy target\release\nestforge.exe nestforge-win32-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: nestforge-win32-x64
          path: nestforge-win32-x64.exe

  release:
    needs: [get-version, build-darwin-arm64, build-linux-x64, build-win32-x64]
    if: needs.get-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
      - name: Bump versions across all workspaces
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          npm pkg set version="$VERSION" --workspace packages/cli
          npm pkg set version="$VERSION" --workspace packages/darwin-arm64
          npm pkg set version="$VERSION" --workspace packages/linux-x64
          npm pkg set version="$VERSION" --workspace packages/win32-x64
          npm pkg set "optionalDependencies.@nestforge/cli-darwin-arm64=$VERSION" --workspace packages/cli
          npm pkg set "optionalDependencies.@nestforge/cli-linux-x64=$VERSION" --workspace packages/cli
          npm pkg set "optionalDependencies.@nestforge/cli-win32-x64=$VERSION" --workspace packages/cli
      - name: Place binaries into platform package directories
        run: |
          cp nestforge-darwin-arm64/nestforge-darwin-arm64 packages/darwin-arm64/nestforge-darwin-arm64
          cp nestforge-linux-x64/nestforge-linux-x64 packages/linux-x64/nestforge-linux-x64
          cp nestforge-win32-x64/nestforge-win32-x64.exe packages/win32-x64/nestforge-win32-x64.exe
      - name: Set executable permissions on Unix binaries
        run: |
          chmod +x packages/darwin-arm64/nestforge-darwin-arm64
          chmod +x packages/linux-x64/nestforge-linux-x64
      - name: Publish packages to npm registry
        run: |
          npm publish --workspace packages/darwin-arm64
          npm publish --workspace packages/linux-x64
          npm publish --workspace packages/win32-x64
          npm publish --workspace packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
